$kind: http-request
url: "{{baseUrl}}/api/contacts"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "firstname": "Test",
      "lastname": "Student",
      "email": "student@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Created", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("contactsId", pm.response.json()._id);
    language: text/javascript
order: 1000
