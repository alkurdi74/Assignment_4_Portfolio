$kind: http-request
url: "{{baseUrl}}/api/projects"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "firstname": "Test",
      "lastname": "Student",
      "email": "student@example.com",
      "title": "Portfolio Entry",
      "completion": "2026-09-28",
      "description": "Example record for API testing"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Created", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("projectsId", pm.response.json()._id);
    language: text/javascript
order: 1000
